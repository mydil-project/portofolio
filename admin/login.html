<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Login — Aidil Portfolio</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>

<body class="login-page">

  <div class="login-card">

    <span class="logo">AIDIL <span>ADMIN</span></span>
    <h1>Admin Dashboard</h1>
    <p class="sub">Masuk untuk mengelola project, skills, dan informasi portfolio.</p>

    <div class="form-error" id="loginError"></div>

    <form id="loginForm" novalidate>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="username"
               placeholder="emailkamu@gmail.com" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password"
               placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required>
      </div>

      <button type="submit" class="btn btn-primary" id="loginBtn">Masuk</button>

    </form>

    <p class="login-foot">
      <a href="../index.html">&larr; Kembali ke website</a>
    </p>

  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

  <script>window.UI_NO_BOOT = true;</script>
  <script src="../js/site-config.js"></script>
  <script src="../js/seed-data.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/ui.js"></script>
  <script src="login.js"></script>

</body>
</html>
